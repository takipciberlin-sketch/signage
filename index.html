<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=signage_admin_v2.html">
  <title>SignageOS</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#080909; font-family:sans-serif; color:#e2e8f0; }
    .logo { font-size:32px; font-weight:800; color:#fff; text-align:center; }
    .logo span { color:#00e676; }
    .spinner { width:40px; height:40px; border:3px solid rgba(0,230,118,.2); border-top-color:#00e676; border-radius:50%; animation:spin .8s linear infinite; margin:24px auto; }
    .msg { font-size:14px; color:#718096; text-align:center; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <div class="logo">Signage<span>OS</span></div>
    <div class="spinner"></div>
    <div class="msg">Admin panele yönlendiriliyor...</div>
  </div>
</body>
</html>
