<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=signage_admin_v2.html">
  <title>SignageOS - Yönlendiriliyor...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #080909;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e2e8f0;
    }
    .container {
      text-align: center;
    }
    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 16px;
    }
    .logo span {
      color: #00e676;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(0, 230, 118, 0.2);
      border-top-color: #00e676;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 24px auto;
    }
    .message {
      font-size: 14px;
      color: #718096;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Signage<span>OS</span></div>
    <div class="spinner"></div>
    <div class="message">Admin panele yönlendiriliyor...</div>
  </div>
</body>
</html>
