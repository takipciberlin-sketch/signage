<style>
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100vh; background:#000; font-family:sans-serif; overflow:hidden; }

#setupScreen {
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  height:100vh; background:#080909; color:#e2e8f0;
}
.setup-logo { font-size:32px; font-weight:800; color:#fff; margin-bottom:8px; }
.setup-logo span { color:#00e676; }
.setup-sub { font-size:14px; color:#718096; margin-bottom:40px; }
.setup-field { display:flex; flex-direction:column; gap:6px; width:360px; margin-bottom:16px; }
.setup-label { font-size:11px; font-weight:700; color:#718096; letter-spacing:1px; text-transform:uppercase; }
.setup-input {
  background:#1a1d1d; border:1px solid rgba(255,255,255,.08);
  border-radius:8px; padding:12px 16px;
  color:#e2e8f0; font-size:14px; outline:none;
}
.setup-input:focus { border-color:rgba(0,230,118,.4); }
.setup-btn {
  width:360px; padding:14px; border-radius:8px; border:none;
  background:#00e676; color:#000; font-size:15px; font-weight:700;
  cursor:pointer; margin-top:8px;
}
.setup-note { font-size:12px; color:#4a5568; margin-top:16px; text-align:center; max-width:360px; }

#waitScreen {
  display:none; flex-direction:column;
  align-items:center; justify-content:center;
  height:100vh; background:#080909; color:#e2e8f0; text-align:center;
}
.wait-logo { font-size:24px; font-weight:800; color:#fff; margin-bottom:6px; }
.wait-logo span { color:#00e676; }
.wait-id { font-size:12px; color:#4a5568; margin-bottom:32px; font-family:monospace; }
.wait-spinner {
  width:40px; height:40px; border:3px solid rgba(0,230,118,.2);
  border-top-color:#00e676; border-radius:50%;
  animation:spin .8s linear infinite; margin-bottom:16px;
}
.wait-msg { font-size:14px; color:#718096; }
.wait-status { font-size:12px; color:#4a5568; margin-top:8px; }

 #menuFrame { display:none; position:fixed; top:0; left:0; right:0; bottom:0; width:100%; height:100%; border:none; overflow:hidden; }

#statusBar {
  position:fixed; bottom:12px; right:12px;
  display:flex; align-items:center; gap:6px;
  background:rgba(0,0,0,.6); border-radius:20px; padding:5px 10px;
  font-size:10px; color:rgba(255,255,255,.4); pointer-events:none; z-index:9999;
}
#statusDot { width:6px; height:6px; border-radius:50%; background:#00e676; animation:pulse 2s infinite; }

@keyframes spin { to { transform:rotate(360deg); } }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

/* ── ALT BANT (TICKER) ── */
#tickerBar {
  position:fixed; bottom:0; left:0; right:0;
  height:50px; display:none;
  background:linear-gradient(90deg, rgba(0,0,0,0.95), rgba(0,0,0,0.85));
  border-top:2px solid #00e676;
  z-index:9998;
  align-items:center;
  font-family:'Inter', sans-serif;
}
#tickerWeather {
  flex-shrink:0;
  display:flex; align-items:center; gap:10px;
  padding:0 20px; height:100%;
  background:rgba(0,230,118,0.1);
  border-right:2px solid rgba(0,230,118,0.3);
  color:#fff; font-weight:600; font-size:18px;
  white-space:nowrap;
}
#tickerWeather .icon { font-size:28px; }
#tickerWeather .temp { font-size:22px; font-weight:800; color:#00e676; }
#tickerWeather .city { font-size:13px; color:#b0bec5; font-weight:500; }
#tickerScroll {
  flex:1; overflow:hidden; position:relative; height:100%;
  display:flex; align-items:center;
}
#tickerScroll .scroll-content {
  display:inline-block; white-space:nowrap;
  font-size:20px; font-weight:700;
  padding-left:100%;
}
.scroll-content span { padding:0 40px; }
@keyframes tickerScroll {
  0%   { transform:translateX(0); }
  100% { transform:translateX(-100%); }
}

/* ══════════════════════════════════════════════ */
/* ÜST EFEKT ANİMASYONLARI (ürünlerin üstüne) */
/* ══════════════════════════════════════════════ */

/* 🔥 ATEŞ */
.anim-fire { position:relative; width:100%; height:100%; }
.anim-fire .flame {
  position:absolute;
  bottom:0;
  width:30%;
  height:60%;
  border-radius:50% 50% 20% 20% / 60% 60% 40% 40%;
  filter:blur(4px);
  opacity:0.9;
}
.anim-fire .f1 { left:35%; background:radial-gradient(circle at 50% 100%, #ffeb3b 0%, #ff9800 40%, #f44336 70%, transparent 100%); animation:flame 1.2s ease-in-out infinite; }
.anim-fire .f2 { left:20%; background:radial-gradient(circle at 50% 100%, #ffc107 0%, #ff5722 50%, transparent 100%); animation:flame 1s ease-in-out infinite 0.2s; width:25%; height:50%; }
.anim-fire .f3 { left:55%; background:radial-gradient(circle at 50% 100%, #ffeb3b 0%, #ff5722 50%, transparent 100%); animation:flame 1.4s ease-in-out infinite 0.1s; width:25%; height:55%; }
.anim-fire .f4 { left:5%; background:radial-gradient(circle at 50% 100%, #ff9800 0%, #f44336 60%, transparent 100%); animation:flame 1.1s ease-in-out infinite 0.3s; width:20%; height:40%; }
.anim-fire .f5 { left:75%; background:radial-gradient(circle at 50% 100%, #ff9800 0%, #f44336 60%, transparent 100%); animation:flame 1.3s ease-in-out infinite 0.4s; width:20%; height:40%; }

@keyframes flame {
  0%, 100% { transform:translateY(0) scaleY(1) scaleX(1); opacity:0.9; }
  25% { transform:translateY(-5%) scaleY(1.1) scaleX(0.95); opacity:1; }
  50% { transform:translateY(-10%) scaleY(0.9) scaleX(1.05); opacity:0.7; }
  75% { transform:translateY(-5%) scaleY(1.05) scaleX(0.95); opacity:0.85; }
}

/* 💨 BUHAR */
.anim-steam { position:relative; width:100%; height:100%; }
.anim-steam .vapor {
  position:absolute;
  bottom:10%;
  width:40%;
  height:40%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.3) 50%, transparent 100%);
  filter:blur(8px);
  opacity:0;
}
.anim-steam .v1 { left:30%; animation:vapor 2.5s ease-out infinite; }
.anim-steam .v2 { left:15%; animation:vapor 2.8s ease-out infinite 0.6s; width:35%; height:35%; }
.anim-steam .v3 { left:50%; animation:vapor 3s ease-out infinite 1.2s; width:30%; height:30%; }
.anim-steam .v4 { left:35%; animation:vapor 2.7s ease-out infinite 0.3s; width:32%; height:32%; }

@keyframes vapor {
  0% { transform:translateY(0) scale(0.5); opacity:0; }
  20% { opacity:0.8; }
  100% { transform:translateY(-150%) scale(1.5); opacity:0; }
}

/* 🌡️ ISI DALGASI */
.anim-heat { position:relative; width:100%; height:100%; }
.anim-heat .wave {
  position:absolute;
  bottom:0;
  width:100%;
  height:2px;
  background:linear-gradient(90deg, transparent 0%, rgba(255,180,100,0.6) 50%, transparent 100%);
  filter:blur(2px);
}
.anim-heat .w1 { animation:heat-wave 1.5s ease-in-out infinite; }
.anim-heat .w2 { animation:heat-wave 1.8s ease-in-out infinite 0.5s; }
.anim-heat .w3 { animation:heat-wave 2s ease-in-out infinite 1s; }

@keyframes heat-wave {
  0% { transform:translateY(0) scaleX(0.8); opacity:0; }
  20% { opacity:0.8; }
  100% { transform:translateY(-200%) scaleX(1.2); opacity:0; }
}

/* ⭐ PARILTI (yeni) */
.anim-sparkle { position:relative; width:100%; height:100%; }
.anim-sparkle .star {
  position:absolute;
  width:30%; height:30%;
  background:radial-gradient(circle, rgba(255,255,150,1) 0%, rgba(255,200,50,0.7) 40%, transparent 70%);
  border-radius:50%;
  filter:blur(2px);
  opacity:0;
}
.anim-sparkle .s1 { left:20%; top:30%; animation:sparkle-pop 1.8s ease-in-out infinite; }
.anim-sparkle .s2 { left:65%; top:55%; animation:sparkle-pop 2.2s ease-in-out infinite 0.4s; width:25%; height:25%; }
.anim-sparkle .s3 { left:45%; top:20%; animation:sparkle-pop 2s ease-in-out infinite 0.8s; width:22%; height:22%; }
.anim-sparkle .s4 { left:75%; top:25%; animation:sparkle-pop 1.6s ease-in-out infinite 0.2s; width:18%; height:18%; }
.anim-sparkle .s5 { left:15%; top:65%; animation:sparkle-pop 2.4s ease-in-out infinite 1.1s; width:20%; height:20%; }

@keyframes sparkle-pop {
  0%, 100% { transform:scale(0) rotate(0deg); opacity:0; }
  20% { transform:scale(1.2) rotate(90deg); opacity:1; }
  50% { transform:scale(0.8) rotate(180deg); opacity:0.8; }
  80% { transform:scale(1) rotate(270deg); opacity:0.6; }
}

/* Lottie container */
.lottie-container { width:100%; height:100%; }
</style>
</head>

<script>

  apiKey: "AIzaSyCdKqY3Z4hvfDocb9qRG1LFGX28AWB_EG0",
  authDomain: "signage-system-ee041.firebaseapp.com",

  messagingSenderId: "583450867671",
  appId: "1:583450867671:web:b8409c66bdd6178222fd92"
});

var fdb = firebase.database();
var _params = new URLSearchParams(window.location.search);
var shopId = _params.get('shop') || localStorage.getItem('sgs_shopId');
var screenId = _params.get('screen') || localStorage.getItem('sgs_screenId');
if (_params.get('shop')) localStorage.setItem('sgs_shopId', _params.get('shop'));
if (_params.get('screen')) localStorage.setItem('sgs_screenId', _params.get('screen'));
var currentUrl = '';

// Başlat butonu
document.getElementById('startBtn').addEventListener('click', function() {
  var s = document.getElementById('inputShopId').value.trim();
  var e = document.getElementById('inputScreenId').value.trim();
  if (!s || !e) { alert('Lütfen her iki alanı da doldurun'); return; }
  shopId = s;
  screenId = e;
  localStorage.setItem('sgs_shopId', shopId);
  localStorage.setItem('sgs_screenId', screenId);
  document.getElementById('setupScreen').style.display = 'none';
  startListening();
});

// Kaydedilmiş ID varsa direkt başlat
if (shopId && screenId) {
  document.getElementById('setupScreen').style.display = 'none';
  startListening();
}

function startListening() {
  document.getElementById('waitScreen').style.display = 'flex';
  document.getElementById('waitId').textContent = shopId + ' · ' + screenId;
  document.getElementById('statusText').textContent = 'bağlanıyor...';

  fdb.ref('screens/' + shopId + '/' + screenId).on('value', function(snap) {
    var data = snap.val();
    console.log('[Firebase] Veri:', data);

    if (!data) {
      document.getElementById('waitStatus').textContent = 'Ekran bulunamadı. Admin panelinden ekran oluşturun.';
      document.getElementById('statusText').textContent = 'bulunamadı';
      return;
    }

    // Restart komutu
    if (data.restartRequest) {
      var last = parseInt(localStorage.getItem('sgs_lastRestart') || '0');
      if (data.restartRequest > last) {
        localStorage.setItem('sgs_lastRestart', String(data.restartRequest));
        doRestart();
        return;
      }
    }

    localStorage.setItem('sgs_lastData', JSON.stringify(data));
    document.getElementById('statusText').textContent = 'bağlı';

    // ALT BANT (TICKER) güncelle
    updateTicker(data);
    
    // FİYAT OVERLAY güncelle
    updatePriceFields(data);
    
    // ÜRÜN EFEKTLERİ güncelle (yeni sistem - bağımsız, esnek konumlu)
    updateEffects(data);
    
    // CANVAS ARKAPLAN VİDEOSU güncelle
    updateCanvasBgVideo(data);

    var url = data.menuUrl || '';
    if (data.scheduleEnabled) {
      var sched = getScheduledUrl(data);
      if (sched) url = sched;
    }

    if (url && url !== currentUrl) {
      currentUrl = url;
      loadContent(url);
    }

    if (!url) {
      document.getElementById('waitScreen').style.display = 'flex';
      document.getElementById('menuFrame').style.display = 'none';
      document.getElementById('menuImage').style.display = 'none';
      document.getElementById('menuVideo').style.display = 'none';
    }

  }, function(error) {
    console.error('[Firebase] Hata:', error);
    // Offline - son kaydedilen veriyi kullan
    var lastData = localStorage.getItem('sgs_lastData');
    if (lastData) {
      var data = JSON.parse(lastData);
      var url = data.menuUrl || '';
      if (url) {
        document.getElementById('statusDot').style.background = '#ffab40';
        document.getElementById('statusText').textContent = 'offline - cache';
        document.getElementById('waitScreen').style.display = 'none';
        loadContent(url);
      }
    } else {
      document.getElementById('waitStatus').textContent = 'Bağlantı yok, cache bulunamadı';
      document.getElementById('statusText').textContent = 'offline';
      document.getElementById('statusDot').style.background = '#ff5252';
    }
  });

  // Ping
  sendPing();
  setInterval(sendPing, 30000);

  // Gece restart
  setInterval(function() {
    var now = new Date();
    if (now.getHours() === 3 && now.getMinutes() === 0) doRestart();
  }, 60000);
}

// ── OFFLINE CACHE SİSTEMİ ──
var cacheDB = null;
var CACHE_DB = 'SignageCache';
var CACHE_STORE = 'media';

function initCache() {
  return new Promise(function(resolve) {
    try {
      var req = indexedDB.open(CACHE_DB, 1);
      req.onupgradeneeded = function(e) {
        e.target.result.createObjectStore(CACHE_STORE, { keyPath: 'url' });
      };
      req.onsuccess = function(e) {
        cacheDB = e.target.result;
        resolve(true);
      };
      req.onerror = function() { resolve(false); };
    } catch(e) { resolve(false); }
  });
}

function getFromCache(url) {
  return new Promise(function(resolve) {
    if (!cacheDB) { resolve(null); return; }
    try {
      var tx = cacheDB.transaction([CACHE_STORE], 'readonly');
      var req = tx.objectStore(CACHE_STORE).get(url);
      req.onsuccess = function() {
        if (req.result && req.result.blob) {
          resolve(URL.createObjectURL(req.result.blob));
        } else {
          resolve(null);
        }
      };
      req.onerror = function() { resolve(null); };
    } catch(e) { resolve(null); }
  });
}

function saveToCache(url, blob) {
  return new Promise(function(resolve) {
    if (!cacheDB) { resolve(); return; }
    try {
      var tx = cacheDB.transaction([CACHE_STORE], 'readwrite');
      tx.objectStore(CACHE_STORE).put({ url: url, blob: blob, saved: Date.now() });
      tx.oncomplete = function() { resolve(); };
      tx.onerror = function() { resolve(); };
    } catch(e) { resolve(); }
  });
}

async function loadWithCache(url, type) {
  // Önce cache'e bak
  var cached = await getFromCache(url);

  if (navigator.onLine) {
    // İnternet var - arka planda indir ve cache'e kaydet
    fetch(url).then(function(r) {
      if (r.ok) return r.blob();
    }).then(function(blob) {
      if (blob) saveToCache(url, blob);
    }).catch(function() {});
    // Cache varsa onu kullan (hızlı), yoksa direkt URL
    return cached || url;
  } else {
    // İnternet yok - sadece cache
    if (cached) {
      document.getElementById('statusDot').style.background = '#ffab40';
      document.getElementById('statusText').textContent = 'offline - cache';
      return cached;
    }
    return url; // Cache de yok, dene bakalım
  }
}

// Cache'i başlat
initCache();

function loadContent(url) {
  document.getElementById('menuFrame').style.display = 'none';
  document.getElementById('menuImage').style.display = 'none';
  document.getElementById('menuVideo').style.display = 'none';
  document.getElementById('waitScreen').style.display = 'none';

  var lower = url.toLowerCase();

  if (lower.match(/\.(jpg|jpeg|png|webp|gif|bmp)(\?|$)/)) {
    // GÖRSEL - cache ile yükle
    loadWithCache(url, 'image').then(function(src) {
      document.getElementById('menuImage').src = src;
      document.getElementById('menuImage').style.display = 'block';
    });
  } else if (lower.match(/\.(mp4|webm|mov)(\?|$)/)) {
    // VİDEO - cache ile yükle
    loadWithCache(url, 'video').then(function(src) {
      var vid = document.getElementById('menuVideo');
      vid.src = src;
      vid.style.display = 'block';
      vid.play().catch(function(){});
    });
  } else {
    // HTML iframe - cache yok
    document.getElementById('menuFrame').src = url;
    document.getElementById('menuFrame').style.display = 'block';
  }

  if (navigator.onLine) {
    document.getElementById('statusDot').style.background = '#00e676';
    document.getElementById('statusText').textContent = 'yayında';
  }
}

function getScheduledUrl(data) {
  var now = new Date();
  var cur = now.getHours() * 60 + now.getMinutes();
  function toMin(t) { if (!t) return -1; var p = t.split(':').map(Number); return p[0]*60+p[1]; }
  function inRange(s,e,c) { if(s<0||e<0) return false; return e>s?(c>=s&&c<e):(c>=s||c<e); }
  if (data.scheduleMorningUrl && inRange(toMin(data.scheduleMorningStart), toMin(data.scheduleMorningEnd), cur)) return data.scheduleMorningUrl;
  if (data.scheduleNoonUrl && inRange(toMin(data.scheduleNoonStart), toMin(data.scheduleNoonEnd), cur)) return data.scheduleNoonUrl;
  if (data.scheduleEveningUrl && inRange(toMin(data.scheduleEveningStart), toMin(data.scheduleEveningEnd), cur)) return data.scheduleEveningUrl;
  return null;
}

function updatePriceFields(data) {
  var overlay = document.getElementById('priceOverlay');
  var fields = data.priceFields || [];
  
  // Sadece menü görseli varsa ve fiyat alanı tanımlıysa göster
  var hasImage = data.menuUrl && data.menuUrl.match(/\.(jpg|jpeg|png|webp|gif)$/i);
  
  if (!hasImage || fields.length === 0) {
    overlay.style.display = 'none';
    overlay.innerHTML = '';
    return;
  }
  
  overlay.style.display = 'block';
  
  // Görselin object-fit:contain konumunu hesapla
  // Görsel ekranda contain edildiği için pozisyonlar görsel oranına göre ayarlanmalı
  // Ama biz % bazlı çalıştığımız için zaten görselin bounding box'ına göre yerleşecek
  
  overlay.innerHTML = fields.map(function(f) {
    // Güçlü gölge - McDonald's tarzı (4 yönde siyah kontur + bulanık gölge)
    var shadow = f.shadow !== false ? 
      'text-shadow:' +
      '4px 4px 0 #000, -4px -4px 0 #000, 4px -4px 0 #000, -4px 4px 0 #000,' + // 4 yön kontur
      '0 0 16px rgba(0,0,0,0.95), 0 6px 12px rgba(0,0,0,0.8);' :              // Bulanık gölge
      '';
    var transform = f.align === 'center' ? 'translate(-50%, -50%)' : 
                    f.align === 'right' ? 'translate(-100%, -50%)' : 
                    'translate(0, -50%)';
    
    // Tam boyutlu - Canva orijinal koordinatlarına göre
    return '<div style="position:absolute;left:' + f.x + '%;top:' + f.y + '%;' +
      'transform:' + transform + ';' +
      'font-family:\'' + (f.font || 'Impact') + '\',sans-serif;' +
      'font-size:' + (f.size || 120) + 'px;' +
      'font-weight:' + (f.weight || '900') + ';' +
      'color:' + (f.color || '#FFD700') + ';' + shadow +
      'white-space:nowrap;line-height:1;">' + 
      (f.value || '') + 
      '</div>';
  }).join('');
}

// Performans için gerçek Lottie yerine CSS animasyon kullanıyoruz
// Canva tarzı efektler - ürünlerin üstünden çıkar
var BUILTIN_ANIMATIONS = {
  fire: {
    html: '<div class="anim-fire"><div class="flame f1"></div><div class="flame f2"></div><div class="flame f3"></div><div class="flame f4"></div><div class="flame f5"></div></div>'
  },

  },

  },

  }
};

// ── ÜST EFEKT ANİMASYONLARI (ürünlerin üstüne) ──
var lottieInstances = {};
// ── ESKİ ANİMASYON SİSTEMİ KALDIRILDI ──
// Artık efektler bağımsız çalışıyor (updateEffects fonksiyonu)
// Fiyat alanlarına bağlı animasyon sistemi artık kullanılmıyor

// ══════════════════════════════════════════════════
// ÜRÜN EFEKTLERİ (YENİ - bağımsız sistem)
// ══════════════════════════════════════════════════
var effectLottieInstances = {};

function updateEffects(data) {
  var overlay = document.getElementById('effectsOverlay');
  var effects = data.effects || [];
  var hasImage = data.menuUrl && data.menuUrl.match(/\.(jpg|jpeg|png|webp|gif)$/i);
  
  // Önceki Lottie örneklerini temizle
  Object.values(effectLottieInstances).forEach(function(instance) {
    try { instance.destroy(); } catch(e) {}
  });
  effectLottieInstances = {};
  
  // Görsel yoksa ya da efekt yoksa gizle
  if (!hasImage || effects.length === 0) {
    overlay.style.display = 'none';
    overlay.innerHTML = '';
    return;
  }
  
  overlay.style.display = 'block';
  
  // 'none' türlü efektleri filtrele (kullanıcı henüz tür seçmemiş, TV'de gösterme)
  var validEffects = effects.filter(function(e) {
    return e.type && e.type !== 'none';
  });
  
  if (validEffects.length === 0) {
    overlay.style.display = 'none';
    overlay.innerHTML = '';
    return;
  }
  
  overlay.innerHTML = validEffects.map(function(e, i) {
    var type = e.type || 'fire';
    var speed = e.speed || 1;
    var intensity = e.intensity || 'medium';
    
    // Yoğunluğa göre opacity
    var opacity = intensity === 'low' ? 0.6 : intensity === 'high' ? 1 : 0.85;
    
    // Animasyon süresi (hıza göre)
    var animDuration = (1.2 / speed).toFixed(2) + 's';
    
    var html = '';
    var instanceId = 'ef_lottie_' + i;
    
    if (BUILTIN_ANIMATIONS[type]) {
      html = BUILTIN_ANIMATIONS[type].html;
    } else if (type === 'custom' && e.lottieUrl) {
      html = '<div id="' + instanceId + '" class="lottie-container" data-url="' + 
             e.lottieUrl.replace(/"/g, '&quot;') + '" data-speed="' + speed + '"></div>';
    }
    
    // Konum: efektin merkezi (e.x, e.y)
    // Boyut: e.width × e.height (% bazlı)
    return '<div class="effect-wrapper" style="' +
      'position:absolute;' +
      'left:' + e.x + '%;' +
      'top:' + e.y + '%;' +
      'width:' + e.width + '%;' +
      'height:' + e.height + '%;' +
      'transform:translate(-50%, -50%);' +
      'opacity:' + opacity + ';' +
      'pointer-events:none;' +
      '--anim-speed:' + speed + ';' +
      '">' + html + '</div>';
  }).join('');
  
  // Hız ayarı: CSS animation-duration'ı her efekt için override et
  var styleId = 'effects-dynamic-style';
  var existingStyle = document.getElementById(styleId);
  if (existingStyle) existingStyle.remove();
  
  var dynamicCSS = '';
  validEffects.forEach(function(e, i) {
    var speed = e.speed || 1;
    var multiplier = 1 / speed;
    dynamicCSS += '.effect-wrapper:nth-child(' + (i+1) + ') .flame { animation-duration:' + (1.2 * multiplier).toFixed(2) + 's !important; }';
    dynamicCSS += '.effect-wrapper:nth-child(' + (i+1) + ') .vapor { animation-duration:' + (2.6 * multiplier).toFixed(2) + 's !important; }';
    dynamicCSS += '.effect-wrapper:nth-child(' + (i+1) + ') .wave { animation-duration:' + (1.7 * multiplier).toFixed(2) + 's !important; }';
    dynamicCSS += '.effect-wrapper:nth-child(' + (i+1) + ') .star { animation-duration:' + (2 * multiplier).toFixed(2) + 's !important; }';
  });
  
  if (dynamicCSS) {
    var styleEl = document.createElement('style');
    styleEl.id = styleId;
    styleEl.textContent = dynamicCSS;
    document.head.appendChild(styleEl);
  }
  
  // Lottie containerlarını yükle
  setTimeout(function() {
    if (typeof lottie === 'undefined') return;
    document.querySelectorAll('#effectsOverlay .lottie-container').forEach(function(el) {
      var url = el.dataset.url;
      var speed = parseFloat(el.dataset.speed) || 1;
      if (!url) return;
      try {
        var anim = lottie.loadAnimation({
          container: el,
          renderer: 'svg',
          loop: true,
          autoplay: true,
          path: url
        });
        anim.setSpeed(speed);
        effectLottieInstances[el.id] = anim;
      } catch(err) {
        console.error('Efekt Lottie yükleme hatası:', err);
      }
    });
  }, 100);
}

function updateCanvasBgVideo(data) {

    video.style.display = 'none';
    video.pause();
    return;

  if (video.paused) {
    video.play().catch(function(e) { console.warn('Video play hatası:', e); });

function updateTicker(data) {
  var bar = document.getElementById('tickerBar');
  
  if (!data.tickerEnabled) {
    bar.style.display = 'none';
    document.getElementById('menuImage').style.height = '100vh';
    document.getElementById('menuVideo').style.height = '100vh';
    return;
  }
  
  bar.style.display = 'flex';
  document.getElementById('menuImage').style.height = 'calc(100vh - 50px)';
  document.getElementById('menuVideo').style.height = 'calc(100vh - 50px)';
  // Hız ayarı
  var speed = data.tickerSpeed || 60;
  var content = document.getElementById('tickerContent');
  content.style.animationDuration = speed + 's';
  
  // Renk
  var color = data.tickerColor || '#FFD700';
  content.style.color = color;
  
  // Yazıları birleştir
  var msgs = data.tickerMessages || [];
  if (typeof msgs === 'string') msgs = [msgs];
  if (!Array.isArray(msgs)) msgs = [];
  
  // Eski format (string) ve yeni format (obje) destekle
  msgs = msgs.map(function(m) {
    if (typeof m === 'string') return { text: m, imageUrl: '' };
    if (m && typeof m === 'object') return { text: String(m.text || ''), imageUrl: String(m.imageUrl || '') };
    return { text: '', imageUrl: '' };
  }).filter(function(m) { return m.text.trim() || m.imageUrl.trim(); });
  
  if (msgs.length === 0) msgs = [{ text: 'Hoş Geldiniz', imageUrl: '' }];
  
  var newKey = JSON.stringify(msgs) + speed + color;
  if (newKey !== lastTickerKey) {
    lastTickerKey = newKey;
    // Her mesajı: [PNG (varsa)] [Metin] • şeklinde render et
    var combined = msgs.map(function(m) {
      var html = '<span style="display:inline-flex;align-items:center;gap:0.5em;vertical-align:middle;">';
      if (m.imageUrl) {
        html += '<img src="' + m.imageUrl.replace(/"/g, '&quot;') + '" style="height:0.85em;width:auto;vertical-align:middle;object-fit:contain;" onerror="this.style.display=\'none\'">';
      }
      html += '<span>' + (m.text || '').replace(/</g, '&lt;') + '</span>';
      html += '</span><span> • </span>';
      return html;
    }).join('');
    content.innerHTML = combined + combined + combined;
  }
  
  // Hava durumu
  var showWeather = data.weatherEnabled !== false; // default true
  var weatherEl = document.getElementById('tickerWeather');
  
  if (showWeather && data.tickerCity) {
    weatherEl.style.display = 'flex';
    if (data.tickerCity !== weatherCity) {
      weatherCity = data.tickerCity;
      fetchWeather(data.tickerCity);
    }
  } else {
    weatherEl.style.display = 'none';
  }
}

function fetchWeather(city) {
  document.getElementById('weatherCity').textContent = city;
  
  // wttr.in - Ücretsiz, API key gerektirmez
  fetch('https://wttr.in/' + encodeURIComponent(city) + '?format=j1')
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var cur = d.current_condition[0];
      var temp = cur.temp_C;
      var desc = cur.weatherDesc[0].value.toLowerCase();
      var icon = '🌤️';
      if (desc.indexOf('clear') >= 0 || desc.indexOf('sunny') >= 0) icon = '☀️';
      else if (desc.indexOf('cloud') >= 0) icon = '☁️';
      else if (desc.indexOf('rain') >= 0) icon = '🌧️';
      else if (desc.indexOf('snow') >= 0) icon = '❄️';
      else if (desc.indexOf('storm') >= 0 || desc.indexOf('thunder') >= 0) icon = '⛈️';
      else if (desc.indexOf('fog') >= 0 || desc.indexOf('mist') >= 0) icon = '🌫️';
      
      document.getElementById('weatherIcon').textContent = icon;
      document.getElementById('weatherTemp').textContent = temp + '°';
      
      // 30 dakikada bir güncelle
      setTimeout(function() { fetchWeather(city); }, 30 * 60 * 1000);
    })
    .catch(function(e) {
      console.warn('[Hava] Hata:', e);
      document.getElementById('weatherTemp').textContent = '--°';
    });
}

function sendPing() {
  if (!shopId || !screenId) return;
  fdb.ref('screens/' + shopId + '/' + screenId).update({ lastSeen: Date.now(), online: true });
}

function doRestart() {
