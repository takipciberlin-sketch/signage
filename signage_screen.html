<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SignageOS · Ekran</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:100%; height:100vh; background:#000; font-family:sans-serif; overflow:hidden; }
#setupScreen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#080909; color:#e2e8f0; }
.setup-logo { font-size:32px; font-weight:800; color:#fff; margin-bottom:8px; }
.setup-logo span { color:#00e676; }
.setup-sub { font-size:14px; color:#718096; margin-bottom:40px; }
.setup-field { display:flex; flex-direction:column; gap:6px; width:360px; margin-bottom:16px; }
.setup-label { font-size:11px; font-weight:700; color:#718096; letter-spacing:1px; text-transform:uppercase; }
.setup-input { background:#1a1d1d; border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:12px 16px; color:#e2e8f0; font-size:14px; outline:none; }
.setup-btn { width:360px; padding:14px; border-radius:8px; border:none; background:#00e676; color:#000; font-size:15px; font-weight:700; cursor:pointer; margin-top:8px; }
.setup-note { font-size:12px; color:#4a5568; margin-top:16px; text-align:center; max-width:360px; }
#waitScreen { display:none; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#080909; color:#e2e8f0; text-align:center; }
.wait-logo { font-size:24px; font-weight:800; color:#fff; margin-bottom:6px; }
.wait-logo span { color:#00e676; }
.wait-id { font-size:12px; color:#4a5568; margin-bottom:32px; font-family:monospace; }
.wait-spinner { width:40px; height:40px; border:3px solid rgba(0,230,118,.2); border-top-color:#00e676; border-radius:50%; animation:spin .8s linear infinite; margin-bottom:16px; }
.wait-msg { font-size:14px; color:#718096; }
.wait-status { font-size:12px; color:#4a5568; margin-top:8px; }
#menuFrame { display:none; position:fixed; inset:0; width:100vw; height:100vh; border:none; }
#statusBar { position:fixed; bottom:12px; right:12px; display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.6); border-radius:20px; padding:5px 10px; font-size:10px; color:rgba(255,255,255,.4); pointer-events:none; z-index:9999; }
#statusDot { width:6px; height:6px; border-radius:50%; background:#00e676; animation:pulse 2s infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }
</style>
</head>
